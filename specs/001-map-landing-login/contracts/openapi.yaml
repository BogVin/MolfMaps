openapi: 3.1.0
info:
  title: MolfMaps API
  version: 0.1.0
  description: >
    REST contract for the Map Landing & Admin Login feature. The frontend
    communicates with the backend exclusively through these endpoints. This
    document is a design contract; the authoritative runtime schema is the
    OpenAPI generated by FastAPI.
servers:
  - url: http://localhost:8000
    description: Local development (Uvicorn)
paths:
  /api/map:
    get:
      summary: Get the main map image
      description: >
        Returns the kal_main_map.webp asset as the public landing map. No
        authentication required (FR-001). Returns 404 if the asset is missing,
        which the frontend handles with a fallback placeholder (FR-012).
      operationId: getMap
      security: []
      responses:
        "200":
          description: The map image.
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: Map asset unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/login:
    post:
      summary: Authenticate the admin
      description: >
        Validates credentials against operator-configured values. On success sets
        a signed, HTTP-only session cookie (FR-005, FR-008). Rejects invalid
        credentials with a single generic message that does not reveal which field
        was wrong (FR-006). If credentials are not configured, all logins fail
        (FR-011).
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated. A `session` cookie is set.
          headers:
            Set-Cookie:
              description: HttpOnly, SameSite=Lax signed session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials (generic, non-revealing).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Missing or empty username/password (FR-007).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/logout:
    post:
      summary: End the admin session
      description: Clears the session cookie (FR-009). Safe to call when not logged in.
      operationId: logout
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Session cleared.
          headers:
            Set-Cookie:
              description: Expired session cookie to clear client state.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /api/session:
    get:
      summary: Report current session status
      description: >
        Returns whether the caller has a valid, unexpired admin session. Used by
        the frontend to reflect logged-in state and to handle an already-logged-in
        admin visiting the login page (FR-008, edge cases).
      operationId: getSession
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Session status (authenticated true or false).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
    LoginResponse:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
          const: true
    SessionResponse:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
    MessageResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          description: Generic message; never reveals which credential field failed.
