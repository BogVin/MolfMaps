openapi: 3.1.0
info:
  title: MolfMaps API
  version: 0.1.0
  description: >
    REST contract consumed by the Angular frontend after migration. Behavior and
    shapes are unchanged from specs/001-map-landing-login/contracts/openapi.yaml
    (FR-009). This copy is the design reference for the Angular consumer; the
    authoritative runtime schema remains the OpenAPI generated by FastAPI.
servers:
  - url: http://localhost:8000
    description: Local backend (Uvicorn). Angular dev uses a proxy so the browser
      calls same-origin /api/* on the ng serve origin.
paths:
  /api/map:
    get:
      summary: Get the main map image
      description: >
        Returns the kal_main_map.webp asset as the public landing map. No
        authentication required. Returns 404 if the asset is missing; Angular
        shows a graceful fallback (FR-008).
      operationId: getMap
      security: []
      responses:
        "200":
          description: The map image.
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: Map asset unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/login:
    post:
      summary: Authenticate the admin
      description: >
        Validates credentials against operator-configured values. On success sets
        a signed, HTTP-only session cookie. Rejects invalid credentials with a
        single generic message. Angular MUST send credentials with cookies
        (withCredentials / credentials include) and MUST NOT embed secrets.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated. A `session` cookie is set.
          headers:
            Set-Cookie:
              description: HttpOnly, SameSite=Lax signed session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials (generic, non-revealing).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Missing or empty username/password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/logout:
    post:
      summary: End the admin session
      description: Clears the session cookie. Safe to call when not logged in.
      operationId: logout
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Session cleared.
          headers:
            Set-Cookie:
              description: Expired session cookie to clear client state.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /api/session:
    get:
      summary: Report current session status
      description: >
        Returns whether the caller has a valid, unexpired admin session. Used by
        Angular to reflect logged-in state and to handle an already-logged-in
        admin visiting the login route.
      operationId: getSession
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Session status (authenticated true or false).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
    LoginResponse:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
          const: true
    SessionResponse:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
    MessageResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          description: Generic message; never reveals which credential field failed.
