openapi: 3.1.0
info:
  title: MolfMaps API
  version: 0.4.0
  description: >
    REST contract after text-mark styling and region links (feature
    005-text-mark-styling). Paths are unchanged from 004; the annotation
    discriminated union gains `region_link`, and text links gain `color` and
    `typeface`. Endpoints inherited from 001/002/003 (/api/map, /api/login,
    /api/logout, /api/session, /api/maps*) remain unchanged and are documented
    in specs/003-maps-list-admin/contracts/openapi.yaml. The authoritative
    runtime schema remains the OpenAPI document generated by FastAPI.

    Authorization model: listing annotations (including styled text and region
    links) and fetching point-of-interest images is public. Creating, editing,
    restyling, resizing, repositioning, and deleting annotations, and attaching
    or detaching images, all require a valid admin session (FR-010, FR-029).
    Hiding authoring controls in the UI is presentation only.

    Zoom, pan, placement mode, and hover CSS are client-side view state and have
    no API surface.
servers:
  - url: http://localhost:8000
    description: Local backend (Uvicorn). Angular dev uses a proxy so the browser
      calls same-origin /api/* on the ng serve origin.
paths:
  /api/maps/{map_id}/annotations:
    parameters:
      - $ref: "#/components/parameters/MapId"
    get:
      summary: List a map's annotations
      description: >
        Returns every annotation on the map, ordered by creation time ascending.
        No authentication required — styled text links, region links, and
        point-of-interest popups are visible to every visitor. A map with no
        annotations returns an empty array. Each text link and region link
        carries `target_available`. Text links always include `color` and
        `typeface` (defaults projected for records stored before this feature).
      operationId: listAnnotations
      security: []
      responses:
        "200":
          description: The map's annotations (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnotationListResponse"
        "404":
          description: No map with this id exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Create an annotation (admin only)
      description: >
        Creates a text link, point of interest, or region link at a position
        on the map. Position (and region size) are fractions of the map image.
        Requires a valid admin session.

        A text link requires `text` and an existing `target_map_id`. `color`
        and `typeface` are optional and default to `#f5f7fa` and `sans`.
        `text_scale` is optional (default 0.03) and is clamped to [0.01, 0.10].

        A region link requires an existing `target_map_id` and has no `text`.
        `width`, `height`, `rest`, and `hover` are optional and default to
        the values in data-model.md; size and opacity/brightness are clamped;
        the rectangle is fitted so it stays on the image.

        A point of interest requires `text` and is created with no images.
      operationId: createAnnotation
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnotationCreateRequest"
      responses:
        "201":
          description: Annotation created and now visible to every visitor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Annotation"
        "401":
          description: >
            No valid admin session. Annotations are unchanged (FR-046).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No map with this id exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            Unknown kind, missing or over-long text, missing target map, a
            target map that does not exist, a position outside [0, 1], an
            invalid color or typeface, or a malformed region appearance.
            Nothing was saved. Size, opacity, and brightness are clamped
            rather than rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/maps/{map_id}/annotations/{annotation_id}:
    parameters:
      - $ref: "#/components/parameters/MapId"
      - $ref: "#/components/parameters/AnnotationId"
    patch:
      summary: Edit, resize, or reposition an annotation (admin only)
      description: >
        Applies a partial update: wording, target map, text size/color/typeface,
        region size/appearance, or position. Omitted fields are left unchanged.
        `kind` is immutable. Fields that do not belong to this annotation's
        kind are rejected (422). `text_scale`, region geometry, opacity, and
        brightness are clamped; invalid color/typeface are rejected.
      operationId: updateAnnotation
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnotationUpdateRequest"
      responses:
        "200":
          description: The updated annotation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Annotation"
        "401":
          description: >
            No valid admin session. The annotation is unchanged (FR-046).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such map, or no such annotation on this map.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            Empty or over-long text, a target map that does not exist, a
            position outside [0, 1], or a field that does not belong to this
            annotation's kind. Nothing was changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Delete an annotation (admin only)
      description: >
        Permanently removes the annotation and, for a point of interest, its
        stored image files (FR-041). The explicit confirmation step required by
        FR-041 is a frontend concern; this endpoint applies the deletion
        immediately when called. The removal is visible to every visitor on the
        next read (FR-042).
      operationId: deleteAnnotation
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Annotation deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: >
            No valid admin session. The annotation remains (FR-046).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such map, or no such annotation on this map.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/maps/{map_id}/annotations/{annotation_id}/images:
    parameters:
      - $ref: "#/components/parameters/MapId"
      - $ref: "#/components/parameters/AnnotationId"
    post:
      summary: Attach an image to a point of interest (admin only)
      description: >
        Adds one image to the end of the point of interest's ordered image list
        (FR-032). Used by both the create flow and the edit flow, so image
        handling exists once. The image is validated by sniffing its leading
        bytes against the same allowlist and size cap used for map uploads; the
        client-supplied filename and Content-Type are ignored and the stored
        filename derives from a server-generated id (FR-037).

        A refused upload leaves the point of interest unchanged rather than in a
        broken state, which is why a text-only point of interest remains valid
        after a failed attachment.
      operationId: addAnnotationImage
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AddImageRequest"
      responses:
        "201":
          description: Image stored and appended to the popup's image list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoiImage"
        "400":
          description: >
            The uploaded file is empty, corrupt, or not an allowed image type.
            Nothing was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No valid admin session. The point of interest is unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such map, or no such annotation on this map.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            The annotation is a text link or region link (neither carries
            images), or the point of interest already holds MAX_POI_IMAGES
            images.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: >
            The image exceeds MAX_MAP_IMAGE_BYTES. The upload is aborted mid
            stream and nothing is stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Missing image part.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/maps/{map_id}/annotations/{annotation_id}/images/{image_id}:
    parameters:
      - $ref: "#/components/parameters/MapId"
      - $ref: "#/components/parameters/AnnotationId"
      - $ref: "#/components/parameters/ImageId"
    get:
      summary: Get a point-of-interest image's bytes
      description: >
        Streams the stored image with its detected media type. No authentication
        required, so logged-out visitors can open popups (FR-048). Returns 404
        when the annotation or its file is missing, which the frontend renders as
        a graceful fallback beside the still-readable text rather than a broken
        image (FR-036).
      operationId: getAnnotationImage
      security: []
      responses:
        "200":
          description: The image.
          content:
            image/webp:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        "404":
          description: Map, annotation, or image unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Detach an image from a point of interest (admin only)
      description: >
        Removes the image from the point of interest's list and unlinks the
        stored file. Part of editing a point of interest's images (FR-039).
      operationId: deleteAnnotationImage
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Image removed from the popup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: No valid admin session. The images are unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such map, annotation, or image.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/maps/{map_id}:
    parameters:
      - $ref: "#/components/parameters/MapId"
    get:
      summary: Get one map's metadata (unchanged from 003)
      description: >
        Reproduced here only because following a text link resolves the target
        through this endpoint. A target map deleted after the link was saved
        answers 404 with "This map is no longer available.", which is what the
        frontend shows instead of a broken view (FR-030). The contract itself is
        unchanged.
      operationId: getMapById
      security: []
      responses:
        "200":
          description: The requested map.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapSummary"
        "404":
          description: No map with this id exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Delete a map (admin only, behavior extended)
      description: >
        Unchanged request and response contract from 003. Behavior is extended:
        deleting a map now also removes its annotations and unlinks their
        point-of-interest image files (FR-044). Text links on *other* maps that
        pointed at this one are deliberately left in place and simply report
        `target_available: false` afterwards (FR-030).
      operationId: deleteMap
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Map, its image, and its annotations deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: No valid admin session. The map remains available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No map with this id exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    MapId:
      name: map_id
      in: path
      required: true
      description: >
        Server-generated map identifier (32 lowercase hex characters). Declared
        as an opaque string at runtime, so an id of any other shape resolves to
        404 rather than a validation error.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    AnnotationId:
      name: annotation_id
      in: path
      required: true
      description: >
        Server-generated annotation identifier (32 lowercase hex characters).
        Must belong to the map named in the path; an annotation from another map
        resolves to 404.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    ImageId:
      name: image_id
      in: path
      required: true
      description: >
        Server-generated point-of-interest image identifier (32 lowercase hex
        characters). Must belong to the annotation named in the path.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
  schemas:
    Annotation:
      description: >
        One annotation on a map. Discriminated on `kind`, so each variant
        declares exactly the fields it needs rather than sharing one model of
        optional fields.
      oneOf:
        - $ref: "#/components/schemas/TextLinkAnnotation"
        - $ref: "#/components/schemas/PoiAnnotation"
        - $ref: "#/components/schemas/RegionLinkAnnotation"
      discriminator:
        propertyName: kind
        mapping:
          text_link: "#/components/schemas/TextLinkAnnotation"
          poi: "#/components/schemas/PoiAnnotation"
          region_link: "#/components/schemas/RegionLinkAnnotation"
    AnnotationBase:
      type: object
      required: [id, map_id, kind, x, y, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{32}$"
          description: Opaque, immutable identity.
        map_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
          description: The owning map. An annotation belongs to exactly one map.
        kind:
          type: string
          enum: [text_link, poi, region_link]
          description: Immutable after creation.
        x:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: >
            Horizontal position as a fraction of the map image's width. Stored
            relative to the image, never in screen pixels, so it stays correct at
            any viewport size and zoom level (FR-038).
        y:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Vertical position as a fraction of the map image's height.
        created_at:
          type: string
          format: date-time
          description: ISO 8601 UTC. Also the list ordering key.
        updated_at:
          type: string
          format: date-time
          description: ISO 8601 UTC. Equal to created_at until the first edit.
    TextLinkAnnotation:
      allOf:
        - $ref: "#/components/schemas/AnnotationBase"
        - type: object
          required: [text, target_map_id, text_scale, color, typeface, target_available]
          properties:
            kind:
              type: string
              const: text_link
            text:
              type: string
              minLength: 1
              maxLength: 120
              description: The displayed label; whitespace is trimmed server-side.
            target_map_id:
              type: string
              pattern: "^[0-9a-f]{32}$"
              description: >
                The map this label opens. May be the owning map itself —
                self-references are allowed and simply keep that map's view.
            text_scale:
              type: number
              format: float
              minimum: 0.01
              maximum: 0.1
              description: >
                Font size as a fraction of the map image's width, so the label
                keeps the same proportion to the map at every zoom level
                and looks identical to every visitor.
            color:
              type: string
              pattern: "^#[0-9a-f]{6}$"
              description: >
                Label text color. Always present on read; records stored before
                this field existed are projected as #f5f7fa.
            typeface:
              type: string
              enum: [sans, serif, condensed]
              description: >
                Offered typeface token. Always present on read; missing values
                are projected as sans (the pre-feature appearance).
            target_available:
              type: boolean
              description: >
                Computed at read time, never stored: whether target_map_id still
                exists in the catalog. False means following the link shows the
                "no longer available" message.
    PoiAnnotation:
      allOf:
        - $ref: "#/components/schemas/AnnotationBase"
        - type: object
          required: [text, images]
          properties:
            kind:
              type: string
              const: poi
            text:
              type: string
              minLength: 1
              maxLength: 2000
              description: >
                Descriptive text shown in the popup. Required — a point of
                interest is never saved without it (FR-033).
            images:
              type: array
              description: >
                Ordered images shown in the popup. Empty is valid and common
                (FR-033). The count is capped at MAX_POI_IMAGES (default 5) by
                the attach endpoint; because that cap is configuration rather
                than contract, it is enforced there and not declared as
                maxItems here.
              items:
                $ref: "#/components/schemas/PoiImage"
    PoiImage:
      type: object
      required: [id, image_url]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        image_url:
          type: string
          description: >
            Relative URL for the image bytes. Clients use this value verbatim
            instead of composing paths.
    RegionAppearance:
      type: object
      required: [color, opacity, brightness]
      additionalProperties: false
      properties:
        color:
          type: string
          pattern: "^#[0-9a-f]{6}$"
        opacity:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: >
            0 is fully clear (map art shows through); 1 is fully solid.
            Out-of-range values are clamped.
        brightness:
          type: number
          format: float
          minimum: 0.25
          maximum: 2
          description: CSS brightness multiplier; 1 is unchanged. Clamped.
    RegionLinkAnnotation:
      allOf:
        - $ref: "#/components/schemas/AnnotationBase"
        - type: object
          required: [target_map_id, width, height, rest, hover, target_available]
          properties:
            kind:
              type: string
              const: region_link
            target_map_id:
              type: string
              pattern: "^[0-9a-f]{32}$"
            width:
              type: number
              format: float
              minimum: 0.04
              maximum: 1
              description: Fraction of map image width. x,y are the top-left corner.
            height:
              type: number
              format: float
              minimum: 0.04
              maximum: 1
            rest:
              $ref: "#/components/schemas/RegionAppearance"
            hover:
              $ref: "#/components/schemas/RegionAppearance"
            target_available:
              type: boolean
    AnnotationListResponse:
      type: object
      required: [annotations]
      properties:
        annotations:
          type: array
          description: >
            The map's annotations, oldest first. Empty when the map has none.
            An object rather than a bare array, so fields can be added later
            without a breaking change.
          items:
            $ref: "#/components/schemas/Annotation"
    AnnotationCreateRequest:
      description: Discriminated on `kind`, matching the response union.
      oneOf:
        - $ref: "#/components/schemas/CreateTextLinkRequest"
        - $ref: "#/components/schemas/CreatePoiRequest"
        - $ref: "#/components/schemas/CreateRegionLinkRequest"
      discriminator:
        propertyName: kind
        mapping:
          text_link: "#/components/schemas/CreateTextLinkRequest"
          poi: "#/components/schemas/CreatePoiRequest"
          region_link: "#/components/schemas/CreateRegionLinkRequest"
    CreateTextLinkRequest:
      type: object
      required: [kind, x, y, text, target_map_id]
      additionalProperties: false
      properties:
        kind:
          type: string
          const: text_link
        x:
          type: number
          format: float
          minimum: 0
          maximum: 1
        y:
          type: number
          format: float
          minimum: 0
          maximum: 1
        text:
          type: string
          minLength: 1
          maxLength: 120
        target_map_id:
          type: string
          description: >
            Must reference a map that exists at write time; an unknown id is
            rejected with 422 so the author gets immediate feedback rather than
            a link that was broken from birth.
        text_scale:
          type: number
          format: float
          description: >
            Optional. Defaults to 0.03 when omitted. Values outside
            [0.01, 0.10] are clamped to the nearest bound rather than rejected.
        color:
          type: string
          pattern: "^#[0-9a-f]{6}$"
          description: Optional. Defaults to #f5f7fa. Invalid values are rejected.
        typeface:
          type: string
          enum: [sans, serif, condensed]
          description: Optional. Defaults to sans. Unknown tokens are rejected.
    CreatePoiRequest:
      type: object
      required: [kind, x, y, text]
      additionalProperties: false
      properties:
        kind:
          type: string
          const: poi
        x:
          type: number
          format: float
          minimum: 0
          maximum: 1
        y:
          type: number
          format: float
          minimum: 0
          maximum: 1
        text:
          type: string
          minLength: 1
          maxLength: 2000
    CreateRegionLinkRequest:
      type: object
      required: [kind, x, y, target_map_id]
      additionalProperties: false
      properties:
        kind:
          type: string
          const: region_link
        x:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Top-left, fraction of image width.
        y:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Top-left, fraction of image height.
        target_map_id:
          type: string
          description: Must reference a map that exists at write time.
        width:
          type: number
          format: float
          description: Optional. Defaults to 0.16; clamped and fitted on-image.
        height:
          type: number
          format: float
          description: Optional. Defaults to 0.10; clamped and fitted on-image.
        rest:
          $ref: "#/components/schemas/RegionAppearance"
        hover:
          $ref: "#/components/schemas/RegionAppearance"
    AnnotationUpdateRequest:
      type: object
      additionalProperties: false
      description: >
        Partial update covering edit, restyle, resize, and reposition. Every
        field is optional; omitted fields are left unchanged. `kind` cannot be
        changed. Supplying a field that belongs to another kind is rejected
        with 422.
      properties:
        x:
          type: number
          format: float
          minimum: 0
          maximum: 1
        y:
          type: number
          format: float
          minimum: 0
          maximum: 1
        text:
          type: string
          minLength: 1
          maxLength: 2000
          description: >
            New label or POI text. Kind-specific max length is enforced against
            the stored kind (120 vs 2000). Not valid for region_link.
        target_map_id:
          type: string
          description: Text links and region links only. Must exist in the catalog.
        text_scale:
          type: number
          format: float
          description: Text links only. Clamped to [0.01, 0.10].
        color:
          type: string
          pattern: "^#[0-9a-f]{6}$"
          description: Text links only. Invalid values are rejected.
        typeface:
          type: string
          enum: [sans, serif, condensed]
          description: Text links only.
        width:
          type: number
          format: float
          description: Region links only. Clamped and fitted on-image.
        height:
          type: number
          format: float
          description: Region links only. Clamped and fitted on-image.
        rest:
          $ref: "#/components/schemas/RegionAppearance"
        hover:
          $ref: "#/components/schemas/RegionAppearance"
    AddImageRequest:
      type: object
      required: [image]
      properties:
        image:
          type: string
          format: binary
          description: >
            Image file. Must be WebP, PNG, JPEG, or GIF as determined by content
            sniffing, and within MAX_MAP_IMAGE_BYTES — the same handling and
            limits already used for map images.
    MapSummary:
      type: object
      required: [id, name, image_url]
      description: Unchanged from 003; referenced when following a text link.
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        name:
          type: string
          minLength: 1
          maxLength: 100
        image_url:
          type: string
    MessageResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          description: >
            Generic message safe to show a user. Never reveals internal paths or
            stack details.
