openapi: 3.1.0
info:
  title: MolfMaps API
  version: 0.2.0
  description: >
    REST contract after adding the map catalog (feature 003-maps-list-admin).
    The endpoints inherited from 001/002 (/api/map, /api/login, /api/logout,
    /api/session) are unchanged and reproduced here so this file is the complete
    design reference for the Angular consumer. The authoritative runtime schema
    remains the OpenAPI document generated by FastAPI.

    Authorization model: listing and opening maps is public. Creating and
    deleting maps require a valid admin session cookie and are enforced
    server-side — hiding controls in the UI is presentation only.
servers:
  - url: http://localhost:8000
    description: Local backend (Uvicorn). Angular dev uses a proxy so the browser
      calls same-origin /api/* on the ng serve origin.
paths:
  /api/maps:
    get:
      summary: List all maps
      description: >
        Returns every map in the catalog, ordered by creation time ascending. No
        authentication required (FR-001). An empty catalog returns an empty
        array, which the frontend renders as the empty state (FR-007).
      operationId: listMaps
      security: []
      responses:
        "200":
          description: The current map catalog (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapListResponse"
    post:
      summary: Add a new map (admin only)
      description: >
        Creates a catalog entry from a display name and an image file
        (FR-008). Requires a valid admin session (FR-013). The image is
        validated by sniffing its leading bytes against an allowlist; the
        client-supplied filename and Content-Type are ignored. The stored
        filename is derived from the server-generated id. No catalog entry is
        written unless the image is fully received and validated (FR-009).
      operationId: createMap
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateMapRequest"
      responses:
        "201":
          description: Map created and now present in the catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapSummary"
        "400":
          description: >
            The uploaded file is empty, corrupt, or not an allowed image type.
            Nothing was written to the catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: >
            No valid admin session. The catalog is unchanged (FR-014).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: >
            The image exceeds MAX_MAP_IMAGE_BYTES. The upload is aborted mid
            stream and nothing is written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Missing name, blank name, name over 100 characters, or missing image part.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/maps/{map_id}:
    parameters:
      - $ref: "#/components/parameters/MapId"
    get:
      summary: Get one map's metadata
      description: >
        Returns the display name and image URL for a single map. No
        authentication required (FR-004). A deleted or unknown id returns 404 so
        stale links show a clear unavailable message (FR-012).
      operationId: getMapById
      security: []
      responses:
        "200":
          description: The requested map.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapSummary"
        "404":
          description: No map with this id exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Delete a map (admin only)
      description: >
        Permanently removes the map from the catalog and deletes its stored
        image (FR-011, FR-012). Requires a valid admin session. The explicit
        confirmation step required by FR-011 is a frontend concern; this
        endpoint applies the delete immediately when called.
      operationId: deleteMap
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Map deleted. It no longer appears in the list or opens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: >
            No valid admin session. The map remains available (FR-014).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No map with this id exists (already deleted or never existed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/maps/{map_id}/image:
    parameters:
      - $ref: "#/components/parameters/MapId"
    get:
      summary: Get a map's image bytes
      description: >
        Streams the stored image with its detected media type. No authentication
        required. Returns 404 when the map or its file is missing, which the
        frontend renders as a graceful fallback rather than a broken image
        (FR-006).
      operationId: getMapImage
      security: []
      responses:
        "200":
          description: The map image.
          content:
            image/webp:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        "404":
          description: Map or image unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/map:
    get:
      summary: Get the main landing map image (unchanged)
      description: >
        Returns the kal_main_map.webp asset used by the home landing page.
        Behavior is unchanged from 001/002; the catalog endpoints above do not
        replace it.
      operationId: getMap
      security: []
      responses:
        "200":
          description: The map image.
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: Map asset unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/login:
    post:
      summary: Authenticate the admin (unchanged)
      description: >
        Validates credentials against operator-configured values and sets a
        signed, HTTP-only session cookie. The same session now also authorizes
        map create/delete (FR-016).
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated. A `session` cookie is set.
          headers:
            Set-Cookie:
              description: HttpOnly, SameSite=Lax signed session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials (generic, non-revealing).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Missing or empty username/password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/logout:
    post:
      summary: End the admin session (unchanged)
      description: Clears the session cookie. Safe to call when not logged in.
      operationId: logout
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Session cleared.
          headers:
            Set-Cookie:
              description: Expired session cookie to clear client state.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /api/session:
    get:
      summary: Report current session status (unchanged)
      description: >
        Returns whether the caller has a valid, unexpired admin session. The
        Maps page uses this to decide whether to render add/delete controls;
        the backend still enforces authorization independently.
      operationId: getSession
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Session status (authenticated true or false).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
components:
  parameters:
    MapId:
      name: map_id
      in: path
      required: true
      description: >
        Server-generated map identifier (32 lowercase hex characters). Declared
        as an opaque string at runtime, so an id of any other shape resolves to
        404 rather than a validation error — stale links get the same clear
        "no longer available" answer whatever their format.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
  schemas:
    MapSummary:
      type: object
      required: [id, name, image_url]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{32}$"
          description: Opaque identity; independent of the display name.
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Display name. Not unique — two maps may share a name.
        image_url:
          type: string
          description: >
            Relative URL for the image bytes, `/api/maps/{id}/image`. Clients
            use this value verbatim instead of composing paths.
    MapListResponse:
      type: object
      required: [maps]
      properties:
        maps:
          type: array
          description: All catalog maps, oldest first. Empty when no maps exist.
          items:
            $ref: "#/components/schemas/MapSummary"
    CreateMapRequest:
      type: object
      required: [name, image]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Display name; surrounding whitespace is trimmed server-side.
        image:
          type: string
          format: binary
          description: >
            Image file. Must be WebP, PNG, JPEG, or GIF as determined by content
            sniffing, and within the configured size limit.
    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
    LoginResponse:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
          const: true
    SessionResponse:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
    MessageResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          description: >
            Generic message safe to show a user. Never reveals which credential
            field failed, internal paths, or stack details.
